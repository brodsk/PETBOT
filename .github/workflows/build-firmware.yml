name: Build PETBOT firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - "tools/usb-flash/**"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build PETBOT
        run: pio run -e petbot
      - name: Prepare NVS-preserving USB package
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/petbot"
          PACKAGE="PETBOT-USB-preserve-settings"
          mkdir -p "$PACKAGE"
          for file in bootloader.bin partitions.bin boot_app0.bin firmware.bin; do
            test -s "$BUILD/$file"
            cp "$BUILD/$file" "$PACKAGE/$file"
          done
          cp tools/usb-flash/flash.bat "$PACKAGE/flash.bat"
          cat > "$PACKAGE/README.txt" <<'EOF'
PETBOT USB INSTALLER (Windows)

1. Extract the entire ZIP into one folder.
2. Connect the PETBOT ESP32 board to the PC with USB.
3. Close Arduino Serial Monitor / PlatformIO Monitor if it is open.
4. Double-click flash.bat.
5. Enter the board's COM port (for example COM3).
6. Wait until the script says installation completed.

Python 3 is required. If it is missing, install it from:
https://www.python.org/downloads/windows/

The script installs esptool and flashes:
- bootloader at 0x1000
- partition table at 0x8000
- OTA boot data at 0xE000
- firmware at 0x10000

It deliberately does NOT erase flash and does NOT write the NVS area,
so saved Wi-Fi credentials and device settings are preserved.
Do not disconnect the board during flashing.
EOF
          cd "$PACKAGE"
          zip -q -r "../$PACKAGE.zip" .
          cd ..
          test -s "$PACKAGE.zip"
          ls -lh "$PACKAGE.zip" "$BUILD/firmware.bin"
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: PETBOT-USB-preserve-settings
          path: |
            .pio/build/petbot/firmware.bin
            PETBOT-USB-preserve-settings.zip
          if-no-files-found: error
          retention-days: 30
