name: Build PETBOT firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build PETBOT
        run: pio run -e petbot

      - name: Upload firmware binary
        uses: actions/upload-artifact@v4
        with:
          name: PETBOT-firmware
          path: .pio/build/petbot/firmware.bin
          if-no-files-found: error
          retention-days: 30
