name: Build PETBOT firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - "tools/usb-flash/**"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build PETBOT
        run: pio run -e petbot
      - name: Prepare NVS-preserving USB package
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/petbot"
          PACKAGE="PETBOT-USB-preserve-settings"
          mkdir -p "$PACKAGE"
          for file in bootloader.bin partitions.bin firmware.bin; do
            test -s "$BUILD/$file"
            cp "$BUILD/$file" "$PACKAGE/$file"
          done
          BOOT_APP0=$(find "$HOME/.platformio" -type f -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0" && test -s "$BOOT_APP0"
          cp "$BOOT_APP0" "$PACKAGE/boot_app0.bin"
          cp tools/usb-flash/flash.bat "$PACKAGE/flash.bat"
          cp tools/usb-flash/README.txt "$PACKAGE/README.txt"
          python -c 'import os,sys,zipfile; p=sys.argv[1]; z=zipfile.ZipFile(p+".zip","w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(p,f),f) for f in os.listdir(p)]; z.close()' "$PACKAGE"
          test -s "$PACKAGE.zip"
          ls -lh "$PACKAGE.zip" "$BUILD/firmware.bin"
      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: PETBOT-USB-preserve-settings
          path: |
            .pio/build/petbot/firmware.bin
            PETBOT-USB-preserve-settings.zip
          if-no-files-found: error
          retention-days: 30
