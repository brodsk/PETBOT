name: PETBOT firmware release

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e petbot
      - name: Create full USB flash image
        shell: bash
        run: |
          set -euo pipefail
          BUILD=".pio/build/petbot"
          ESPTOOL="$HOME/.platformio/packages/tool-esptool/esptool.py"
          for file in bootloader.bin partitions.bin boot_app0.bin firmware.bin; do
            test -s "$BUILD/$file"
          done
          python "$ESPTOOL" --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            -o "$BUILD/PETBOT-full-flash.bin" \
            0x1000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BUILD/boot_app0.bin" \
            0x10000 "$BUILD/firmware.bin"
          test -s "$BUILD/PETBOT-full-flash.bin"
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'FIRMWARE_VERSION = "\K[^"]+' firmware/PETBOT_ESP32.ino)
          BIN=".pio/build/petbot/firmware.bin"
          FULL=".pio/build/petbot/PETBOT-full-flash.bin"
          test -s "$BIN"
          test -s "$FULL"
          SIZE=$(stat -c%s "$BIN")
          MAX_SIZE=$((0x1E0000))
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Firmware is ${SIZE} bytes; OTA slot limit is ${MAX_SIZE} bytes" >&2
            exit 1
          fi
          echo "Firmware size: ${SIZE}/${MAX_SIZE} bytes"
          MD5=$(md5sum "$BIN" | cut -d' ' -f1)
          TAG="firmware-$VERSION"
          mkdir -p release
          cp "$BIN" release/petbot.bin
          cp "$FULL" release/PETBOT-full-flash.bin
          printf '%s\n%s\n' "$VERSION" "$MD5" > release/manifest.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" --yes || true
          gh release create "${{ steps.release.outputs.tag }}" release/petbot.bin release/manifest.txt release/PETBOT-full-flash.bin \
            --title "PETBOT ${{ steps.release.outputs.version }}" \
            --notes "OTA firmware plus a complete 4 MB USB flash image (bootloader, partition table, boot_app0 and firmware). For a clean USB install, flash PETBOT-full-flash.bin at address 0x0."
