name: PETBOT firmware release

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "platformio.ini"
      - "partitions_ota.csv"
      - "tools/usb-flash/**"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run -e petbot
      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'FIRMWARE_VERSION = "\K[^"]+' firmware/PETBOT_ESP32.ino)
          BUILD=".pio/build/petbot"
          BIN="$BUILD/firmware.bin"
          SIZE=$(stat -c%s "$BIN")
          MAX_SIZE=$((0x1E0000))
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "Firmware is ${SIZE} bytes; OTA slot limit is ${MAX_SIZE} bytes" >&2
            exit 1
          fi
          echo "Firmware size: ${SIZE}/${MAX_SIZE} bytes"
          for file in bootloader.bin partitions.bin firmware.bin; do
            test -s "$BUILD/$file"
          done
          BOOT_APP0=$(find "$HOME/.platformio" -type f -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0" && test -s "$BOOT_APP0"
          MD5=$(md5sum "$BIN" | cut -d' ' -f1)
          TAG="firmware-$VERSION"
          mkdir -p release
          cp "$BIN" release/petbot.bin
          cp "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$BUILD/firmware.bin" tools/usb-flash/flash.bat release/
          cp "$BOOT_APP0" release/boot_app0.bin
          cp tools/usb-flash/README.txt release/README.txt
          python -c 'import os,zipfile; p="release"; z=zipfile.ZipFile("PETBOT-USB-preserve-settings.zip","w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(p,f),f) for f in os.listdir(p) if f != "manifest.txt"]; z.close()'
          printf '%s\n%s\n' "$VERSION" "$MD5" > release/manifest.txt
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.release.outputs.tag }}" --yes || true
          gh release create "${{ steps.release.outputs.tag }}" release/petbot.bin release/manifest.txt PETBOT-USB-preserve-settings.zip \
            --title "PETBOT ${{ steps.release.outputs.version }}" \
            --notes "OTA firmware plus a Windows USB installer package. The USB script preserves NVS settings and saved Wi-Fi credentials."
